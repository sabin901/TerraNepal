name: Publish TerraNepal research dashboard
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: read
concurrency:
  group: terranepal-pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install research validation dependencies
        run: pip install -r requirements.txt pip-audit==2.10.1
      - name: Check public schema and failure behavior
        run: |
          python -m unittest discover -s public_site -p 'test_*.py' -v
          node public_site/test_logic.cjs
          python -m unittest discover -s disaster_lab -p 'test_*.py'
          python -m unittest discover -s disaster_archive -p 'test_*.py'
          pip-audit -r requirements.txt
      - name: Build reviewed seed without network access
        run: python public_site/pipeline.py build --output runtime/site
  build:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Restore durable public data and watermarks
        run: python public_site/data_branch.py restore
      - name: Refresh public sources
        run: python public_site/pipeline.py refresh --output runtime/public-snapshot.json
      - name: Preserve rolling weather bytes even after validation failure
        if: always()
        run: python public_site/weather_evidence.py --root runtime/public-state --rolling-only
      - name: Collect initialized research runs
        id: research
        continue-on-error: true
        timeout-minutes: 6
        run: python public_site/weather_evidence.py --root runtime/public-state
      - name: Report unavailable research acquisition
        if: always() && steps.research.outcome == 'failure'
        run: echo "::warning::Original-run research acquisition failed. No complete research coverage is claimed; validated public source data can still publish."
      - name: Retain weather evidence recovery artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weather-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/public-state/evidence/weather
          retention-days: 90
          if-no-files-found: ignore
      - name: Retain selected history before publication
        id: history
        run: python public_site/data_branch.py save
      - name: Build reviewed public files only
        run: python public_site/pipeline.py build --snapshot runtime/public-snapshot.json --output runtime/site
      - name: Retain compact run diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runtime/public-state/run-report.json
            runtime/public-state/health-report.json
            runtime/public-state/weather-evidence-report.json
            runtime/public-state/storage-report.json
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v4
        with:
          path: runtime/site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy public research dashboard
        id: deployment
        uses: actions/deploy-pages@v4
